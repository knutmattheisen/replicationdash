name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Windows EXE
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          rm -f go.sum
          go mod tidy
          go build -ldflags="-s -w -H windowsgui" -o mergedash.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: mergedash.exe
          generate_release_notes: true
